name: Keep HF Space Alive

on:
  schedule:
    - cron: '0 */12 * * *' # 每 12 小時執行一次
  workflow_dispatch: # 允許在 GitHub 網頁上手動點擊執行

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Hugging Face Space
        env:
          SPACE_URL: ${{ secrets.HF_SPACE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          curl -f -X GET "$HF_SPACE_URL" \
            -H "Authorization: Bearer $HF_TOKEN"
